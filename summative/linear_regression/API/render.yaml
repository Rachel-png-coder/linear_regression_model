services:
  - type: web
    name: power-prediction-api
    runtime: python
    repo: https://github.com/YOUR_USERNAME/linear_regression_model
    branch: main
    buildCommand: cd summative/linear_regression/API && pip install -r requirements.txt
    startCommand: cd summative/linear_regression/API && uvicorn prediction:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
    healthCheckPath: /health
    autoDeploy: true